<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}}</title><meta name="description" content="{{description}}"><link rel="canonical" href="{{url}}">{{alternates}}<meta property="og:type" content="website"><meta property="og:locale" content="{{locale}}"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:url" content="{{url}}"><meta name="theme-color" content="#ffffff"><link rel="icon" type="image/svg+xml" href="/logo-mark.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header class="site-header"><a class="brand" href="{{home}}"><img class="brand-icon" src="/logo-mark.svg" width="58" height="58" alt=""><span class="brand-name">{{brand}}</span></a><div class="header-controls"><a class="nav" href="{{home}}#recipes">{{all}} ↗</a>{{switcher}}</div></header><main>{{content}}</main><footer><span>{{footer}}</span><a href="{{home}}">{{brandPlain}} · {{book}}</a><small class="image-note">{{imageNote}}</small></footer></body></html>
